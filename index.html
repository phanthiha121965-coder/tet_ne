    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        gaming: ['Rajdhani', 'sans-serif'],
                    },
                    colors: {
                        cosmic: {

                        }
                    }
                }
            }
        };

    <style>
        /* Dark Cosmic + Gothic Red/Black + Subtle RGB Neon */
        * {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05050a;
            background-image:
                radial-gradient(circle at 14% 12%, rgba(220, 38, 38, 0.2) 0%, transparent 42%),
                radial-gradient(circle at 86% 18%, rgba(139, 92, 246, 0.16) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(239, 68, 68, 0.12) 0%, transparent 48%);
            background-attachment: fixed;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(16, 16, 28, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @keyframes rgbNeonPulse {
            0% {
                border-color: rgba(239, 68, 68, 0.45);
                box-shadow: 0 0 18px rgba(239, 68, 68, 0.22), inset 0 0 12px rgba(239, 68, 68, 0.06);
            }
            33% {
                border-color: rgba(168, 85, 247, 0.45);
                box-shadow: 0 0 18px rgba(168, 85, 247, 0.22), inset 0 0 12px rgba(168, 85, 247, 0.06);
            }
            66% {
                border-color: rgba(34, 211, 238, 0.42);
                box-shadow: 0 0 18px rgba(34, 211, 238, 0.18), inset 0 0 12px rgba(34, 211, 238, 0.06);
            }
            100% {
                border-color: rgba(239, 68, 68, 0.45);
                box-shadow: 0 0 18px rgba(239, 68, 68, 0.22), inset 0 0 12px rgba(239, 68, 68, 0.06);
            }
        }

        .rgb-border {
            animation: rgbNeonPulse 7s linear infinite;
        }

        .rgb-top-strip {
            height: 3px;
            width: 100%;
            background: linear-gradient(90deg, #ef4444, #a855f7, #06b6d4, #ef4444);
            background-size: 300% 100%;
            animation: rgbStripFlow 6s linear infinite;
        }

        @keyframes rgbStripFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        /* Fixed Top Header & Guaranteed 3-Line Hamburger Button (#hamburgerBtn) */
        .top-header-bar {
            position: sticky;
            top: 0;
            z-index: 55;
            width: 100%;
            background: rgba(11, 11, 20, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(239, 68, 68, 0.28);
        }

        #hamburgerBtn {
            position: relative;
            z-index: 60;
            min-width: 44px;
            min-height: 44px;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            pointer-events: auto;
            touch-action: manipulation;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #fca5a5;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        #hamburgerBtn:hover,
        #hamburgerBtn:focus-visible {
            background: rgba(239, 68, 68, 0.28);
            border-color: #ef4444;
            color: #ffffff;
        }

        /* Drawer Backdrop (#drawerBackdrop): Strictly Hidden by Default */
        #drawerBackdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 90;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
        }

        #drawerBackdrop.open {
            display: block;
            pointer-events: auto;
        }

        /* Side Drawer (#sideDrawer) */
        #sideDrawer {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 315px;
            max-width: 85vw;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.25s ease;
            pointer-events: auto;
            background: rgba(12, 12, 22, 0.98);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-right: 1px solid rgba(239, 68, 68, 0.35);
            box-shadow: 12px 0 38px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #sideDrawer.open {
            transform: translateX(0);
        }

        /* Modal Overlays */
        .overlay-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 125;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            pointer-events: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .overlay-modal.open {
            display: flex;
            pointer-events: auto;
        }

        /* Separated Screens: Only One Active at a Time */
        .screen-view {
            display: none;
        }

        .screen-view.active {
            display: block;
        }

        /* Standalone Customer vs Admin Workspace Shell */
        #customerWorkspaceShell.workspace-hidden,
        #adminWorkspaceShell.workspace-hidden {
            display: none !important;
        }

        .admin-topbar {
            position: sticky;
            top: 0;
            z-index: 65;
            width: 100%;
            background: rgba(14, 7, 14, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(245, 158, 11, 0.35);
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0b14;
        }
        ::-webkit-scrollbar-thumb {
            background: #282840;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }
    </style>
</head>
